# Weekly: compare lydiahallie/javascript-questions with the commit pinned in
# content/javascript/deck.json, check every "see the original" anchor, and open (or refresh)
# one issue when there is something to look at. Never changes content by itself.
name: Upstream diff

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/import-upstream.mjs --check --report upstream-report.md
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "found=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open or refresh the issue
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream javascript-questions changed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file upstream-report.md
          else
            gh issue create --title "$title" --body-file upstream-report.md
          fi
